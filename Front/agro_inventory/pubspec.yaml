name: agro_inventory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0' # Ajustado para compatibilidad general

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  go_router: ^14.0.0
  cached_network_image: ^3.3.1


  objectbox: ^4.0.0
  objectbox_flutter_libs: ^4.0.0
  path_provider: ^2.1.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

 
  build_runner: ^2.4.8
  objectbox_generator: ^4.0.0
  
  
  flutter_launcher_icons: ^0.13.1 

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/inventagro.png"
  min_sdk_android: 21